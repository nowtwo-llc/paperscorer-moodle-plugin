# Development Moodle for exercising local_paperscorer.
#
# Not part of the deployed plugin. The repo is the deployed artifact, so keep
# this (and docker/, .moodle/, docs/) out of any release zip — see README.
#
# Naming follows the PaperScorer convention: ps-<project>-<service>.
#
#   docker compose up -d
#   docker compose exec ps-moodle-php php admin/cli/install_database.php --agree-license --adminpass=<pw>
#
# Moodle source lives in the sibling ../moodle-instance (cloned separately,
# not vendored) so the plugin can be bind-mounted into it at local/paperscorer.
# It must live outside this repo: mounting the repo into a Moodle tree nested
# inside the repo would be a recursive bind mount.
#
#   git clone --depth 1 --branch MOODLE_405_STABLE \
#     https://github.com/moodle/moodle.git ../moodle-instance

services:
    ps-moodle-php:
        container_name: ps-moodle-php
        build:
            context: ./
            dockerfile: ./docker/php.dockerfile
            args:
                PHP_VERSION: "${PHP_VERSION:-8.4}"
        ports:
            - '8090:80'
        volumes:
            - ${MOODLE_SRC:-../moodle-instance-52}:/var/www/html
            # The plugin under test. The directory name MUST be `paperscorer`:
            # the component name local_paperscorer is derived from the path.
            # Moodle 5.0+ serves from public/, so plugins live in public/local/;
            # on 4.x set MOODLE_PLUGIN_PATH=/var/www/html/local/paperscorer.
            - ./:${MOODLE_PLUGIN_PATH:-/var/www/html/public/local/paperscorer}
            - ps-moodle-data:/var/www/moodledata
            - ps-moodle-phpunit-data:/var/www/phpunitdata
        environment:
            MOODLE_DOCKER_DBTYPE: mysqli
            MOODLE_DOCKER_DBNAME: moodle
            MOODLE_DOCKER_DBUSER: moodle
            MOODLE_DOCKER_DBPASS: moodle
            MOODLE_DOCKER_DBHOST: ps-moodle-database
            MOODLE_DOCKER_WWWROOT: http://localhost:8090
            # 5.0+ serves from public/; for 4.x use /var/www/html.
            APACHE_DOCUMENT_ROOT: ${APACHE_DOCUMENT_ROOT:-/var/www/html/public}
        depends_on:
            ps-moodle-database:
                condition: service_healthy
        networks:
            - ps-moodle-network

    ps-moodle-database:
        container_name: ps-moodle-database
        image: mysql:8.4
        command: >
            --character-set-server=utf8mb4
            --collation-server=utf8mb4_unicode_ci
            --innodb-file-per-table=1
            --skip-log-bin
        ports:
            - '3317:3306'
        volumes:
            - ps-moodle-database-data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: moodle
            MYSQL_DATABASE: moodle
            MYSQL_USER: moodle
            MYSQL_PASSWORD: moodle
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmoodle"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - ps-moodle-network

volumes:
    ps-moodle-database-data:
        driver: local
    ps-moodle-data:
        driver: local
    ps-moodle-phpunit-data:
        driver: local

networks:
    ps-moodle-network:
        driver: bridge
